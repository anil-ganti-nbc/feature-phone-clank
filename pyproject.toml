[project]
name = "feature-phone-clank"
version = "0.0.1"
description = "Change-detection intelligence for official feature-phone sources (FEATURE-01)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# itel-india.com is a client-rendered SPA with no discoverable API/SSR path
# (see collectors/itel.py module docstring and
# docs/FEATURE_PHONE_SCOPE_EXPANSION.md) — a headless browser is the
# smallest mechanism that works. Kept as an optional extra so the base
# install (and every other collector) never pays for a ~300MB browser
# download; only needed for `feature-phone-clank run-experimental` against
# itel-india, never for hmd-nokia or the test suite.
itel = ["playwright>=1.40"]

[project.scripts]
feature-phone-clank = "feature_phone_clank.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"feature_phone_clank.providers.sqlite" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
